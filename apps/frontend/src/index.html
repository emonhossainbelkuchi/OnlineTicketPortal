<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TicketPortal</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- ?v=2 cache-busts the favicon: browsers cache favicon URLs very aggressively (sometimes
         for a whole browser session regardless of hard-refresh), so bump this query string any
         time the icon file itself changes again in the future. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=3" />
    <link rel="alternate icon" type="image/x-icon" href="favicon.ico?v=3" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
